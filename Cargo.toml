[package]
name = "fireshare"
version = "0.1.0"
edition = "2024"
authors = ["Jefferson Marchetti <jeffersonm.ferreira@gmail.com>"]
description = "Send files between machines over HTTP on one port: CLI client, server and browser page"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive", "env"] }
futures-util = "0.3.34"
getrandom = "0.4.3"
hex = "0.4.3"
percent-encoding = "2.3.2"
reqwest = { version = "0.13.5", default-features = false, features = ["stream", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.0", features = ["full"] }
tokio-util = { version = "0.7.20", features = ["io"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
walkdir = "2.5.0"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
